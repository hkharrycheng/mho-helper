<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>魔物獵人 旅人助手（J17）</title>
<link rel="icon" type="image/jpeg" href="images/logo.jpg">
<link rel="shortcut icon" href="images/logo.jpg">
<link rel="apple-touch-icon" href="images/logo.jpg">
<meta name="theme-color" content="#0b0e14">
<style>
  :root{
    --bg:#0b0e14; --panel:#151a23; --panel2:#1b2230; --line:#232b38;
    --text:#d7dee8; --muted:#8b949e; --accent:#58a6ff;
    --fire:#ff7a45; --water:#4aa8ff; --thunder:#f5d76e; --ice:#7fe0ff; --dragon:#b58cff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang HK","Microsoft JhengHei",sans-serif;
    font-size:14px;line-height:1.5}
  a{color:var(--accent);text-decoration:none}
  .wrap{max-width:760px;margin:0 auto;padding:0 12px 78px}
  header.hdr{padding:16px 2px 10px}
  .hdr-top{display:flex;align-items:center;gap:8px}
  .hdr h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.5px}
  .badge{font-size:11px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;color:var(--muted)}
  .hdr .sub{color:var(--muted);font-size:12px;margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
  .hdr .sub b{color:var(--text);font-weight:600}
  .qbar{position:relative;margin:4px 0 8px}
  .qbar input{width:100%;padding:11px 12px 11px 34px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:14px;outline:none}
  .qbar input::placeholder{color:#5b6675}
  .qbar input:focus{border-color:#2f6fb3}
  .qbar .ico{position:absolute;left:11px;top:11px;color:var(--muted);font-size:14px}
  .frow{display:flex;gap:6px;overflow-x:auto;padding:3px 0 5px;scrollbar-width:none}
  .fg{display:flex;gap:6px;flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
  #fGearExtra{display:block}
  #fGearExtra .fg{margin-bottom:2px}
  .frow::-webkit-scrollbar{display:none}
  .frow .lbl{color:#5b6675;font-size:12px;align-self:center;flex:0 0 auto;padding-right:2px}
  .chip{flex:0 0 auto;padding:5px 10px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);font-size:12.5px;cursor:pointer;white-space:nowrap}
  .chip.on{background:#123052;border-color:#2f6fb3;color:#9fd0ff}
  .count{color:var(--muted);font-size:12px;margin:6px 2px 8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;
    display:flex;flex-direction:column}
  .card:active{transform:scale(.985)}
  .thumb{aspect-ratio:1/1;background:radial-gradient(circle at 50% 40%,#1d2635,#111722);
    display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .thumb img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .thumb .ph{font-size:30px;opacity:.55}
  .card .bd{padding:7px 8px 9px}
  .card .nm{font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .mt{color:var(--muted);font-size:11.5px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
  .tg{font-size:10.5px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
  .tg.el-fire{color:var(--fire);border-color:#5a2e22;background:#2a1611}
  .tg.el-water{color:var(--water);border-color:#1e3f5c;background:#101d2a}
  .tg.el-thunder{color:var(--thunder);border-color:#55502a;background:#26240f}
  .tg.el-ice{color:var(--ice);border-color:#245055;background:#0f2427}
  .tg.el-dragon{color:var(--dragon);border-color:#412f5c;background:#1c1428}
  .tg.role{color:#9fd0ff;border-color:#24405c;background:#101d2a}
  .sec-title{font-size:12px;color:var(--muted);letter-spacing:1px;margin:16px 2px 8px;text-transform:uppercase}
  .mon-weak{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
  .mon-weak i{width:6px;height:6px;border-radius:50%;background:#38414f;display:block}
  .mon-weak i.w3{background:#f85149}.mon-weak i.w2{background:#f0b429}.mon-weak i.w1{background:#3fb950}
  footer{color:#5b6675;font-size:11px;text-align:center;padding:18px 8px 4px;line-height:1.7}
  /* bottom nav */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,17,23,.96);
    backdrop-filter:blur(8px);border-top:1px solid var(--line)}
  nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tab{background:none;border:0;color:var(--muted);font-size:12px;padding:6px 2px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
  .tab .ti{font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;height:22px}
  .tab .ti img{width:22px;height:22px;border-radius:50%;object-fit:cover;display:block;background:#111722}
  .tab.on .ti img{box-shadow:0 0 0 2px var(--accent)}
  .tab.on{color:var(--accent)}
  /* detail overlay */
  .ov{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;display:none}
  .ov.show{display:block}
  .ov .bar{position:sticky;top:0;z-index:5;background:rgba(11,14,20,.95);backdrop-filter:blur(8px);
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .ov .bar button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;
    padding:6px 11px;font-size:13px;cursor:pointer;font-family:inherit}
  .ov .bar .ttl{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ov .body{max-width:760px;margin:0 auto;padding:12px 12px 40px}
  .hero{display:flex;gap:12px;align-items:flex-start}
  .hero .im{width:120px;height:120px;flex:0 0 auto;border-radius:12px;background:radial-gradient(circle at 50% 40%,#1d2635,#111722);
    display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line)}
  .hero .im img{max-width:100%;max-height:100%;object-fit:contain}
  .hero .im .ph{font-size:38px;opacity:.5}
  .hero .info{min-width:0;flex:1}
  .hero .info h2{margin:0;font-size:20px;font-weight:700}
  .hero .info .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .hero .info .meta{color:var(--muted);font-size:12px;margin-top:7px;line-height:1.7}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;border:1px solid #24405c;
    background:#101d2a;color:#9fd0ff;font-size:12.5px}
  .sect{margin-top:16px}
  .sect h3{margin:0 0 8px;font-size:14px;color:#e6edf5;display:flex;align-items:center;gap:7px}
  .sect h3 span{font-size:11px;color:var(--muted);font-weight:400}
  .rows{display:flex;flex-direction:column;gap:8px}
  .row{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px;display:flex;gap:10px;cursor:pointer}
  .row .rim{width:56px;height:56px;flex:0 0 auto;border-radius:9px;background:#111722;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .row .rim img{max-width:100%;max-height:100%;object-fit:contain}
  .row .rim .ph{font-size:22px;opacity:.5}
  .row .rb{min-width:0;flex:1}
  .row .rrn{font-size:13.5px;font-weight:600}
  .row .rmt{color:var(--muted);font-size:11.5px;margin-top:3px}
  .row .rsk{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
  .stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:12px}
  .stat div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
  .stat .k{color:var(--muted);font-size:11px}
  .stat .v{font-size:15px;font-weight:600;margin-top:2px;word-break:break-word}
  .kv{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:13px;line-height:1.75;color:#c6cfda}
  .kv b{color:#e6edf5}
  .wstar{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #1c2431}
  .wstar:last-child{border-bottom:0}
  .wstar .en{width:26px;font-size:13px;font-weight:600}
  .wstar .dots{display:flex;gap:5px}
  .wstar .dots i{width:16px;height:16px;border-radius:4px;background:#222b38;display:block}
  .wstar .dots i.on3{background:#f85149}.wstar .dots i.on2{background:#f0b429}.wstar .dots i.on1{background:#3fb950}
  .wstar .txt{color:var(--muted);font-size:11.5px;margin-left:auto}
  .empty{color:var(--muted);font-size:12.5px;text-align:center;padding:26px 10px;border:1px dashed var(--line);border-radius:11px}
  .empty .rst{display:inline-block;margin-top:12px;cursor:pointer;border:1px solid var(--line);color:var(--text)}
  .effs{display:flex;flex-wrap:wrap;gap:10px}
  .eff{display:flex;align-items:center;gap:8px;background:var(--panel2,#10151d);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px}
  .eff .lb{color:var(--muted)}
  .effc{font-weight:600;padding:2px 8px;border-radius:999px;font-size:12px}
  .effc.good{color:#3fb950;background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.35)}
  .effc.bad{color:#f85149;background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.35)}
  .effc.mid{color:#f0b429;background:rgba(240,180,41,.12);border:1px solid rgba(240,180,41,.35)}
  .effc.gray{color:var(--muted);border:1px solid var(--line)}
  /* matrix 表：屬性／異常／道具／咆哮／肉質 統一格式 */
  .mx{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .mx .mgh{padding:6px 11px;font-size:11px;letter-spacing:.8px;color:var(--muted);background:rgba(255,255,255,.035);border-bottom:1px solid var(--line)}
  .mx .mgh+.mgh{border-top:1px solid var(--line)}
  .mx .mr{display:flex;align-items:center;gap:9px;padding:7px 11px;border-bottom:1px solid rgba(255,255,255,.05)}
  .mx .mr:last-child{border-bottom:0}
  .mx .mlb{width:46px;flex:0 0 auto;font-size:12.5px;font-weight:600;color:#e6edf5}
  .mx .dots{display:flex;gap:4px}
  .mx .dots i{width:15px;height:15px;border-radius:4px;background:#222b38;display:block}
  .mx .dots i.on3{background:#f85149}.mx .dots i.on2{background:#f0b429}.mx .dots i.on1{background:#3fb950}
  .mx .mrt{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .mx .pgrp{display:flex;align-items:center;gap:4px}
  .mx .pgrp .pl{font-size:10.5px;color:var(--muted);margin-left:2px}
  .mx .mr.sm{gap:5px;padding:7px 9px}
  .mx .mr.sm .mlb{width:38px;font-size:12px}
  .mx .mr.sm .dots{gap:3px}
  .mx .mr.sm .dots i{width:11px;height:11px;border-radius:3px}
  .mx .mr.sm .pgrp .pl{font-size:9.5px;margin-left:0}
  .mx .mr.sm .mrt{font-size:10.5px}
  /* 冒險者 <-> 魔物 互聯 */
  .rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
  .relc{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
  .relc .ri{width:100%;aspect-ratio:1/1;background:#111722;overflow:hidden}
  .relc .ri img{width:100%;height:100%;object-fit:cover;display:block}
  .relc .rn{padding:5px 6px 6px;font-size:11px;line-height:1.3;color:#dbe4ef;word-break:break-word}
  .relc .rv{color:var(--muted);font-size:10px}
  /* header 右上角資料來源 */
  .hdr-top{justify-content:space-between;align-items:flex-start}
  .brand{display:flex;align-items:center;gap:8px;min-width:0}
  .brand .lg{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#111722;flex:0 0 auto}
  .srcbox{text-align:right;font-size:10.5px;line-height:1.75;color:var(--muted);max-width:60%}
  .srcbox .u{word-break:break-all}
  /* news */
  .nday{margin-top:14px}
  .nday .dh{color:var(--muted);font-size:12px;margin:0 2px 7px;display:flex;justify-content:space-between}
  .ncard{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px;margin-bottom:8px}
  .ncard .ni{width:86px;height:86px;flex:0 0 auto;border-radius:9px;overflow:hidden;background:#111722}
  .ncard .ni img{width:100%;height:100%;object-fit:cover;display:block}
  .ncard .nb{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
  .ncard .nt{font-size:13.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .ncard .nm2{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:auto}
  .ncard .cat{font-size:10.5px;padding:1px 6px;border-radius:5px;background:#123052;color:#9fd0ff;border:1px solid #24405c}
  .ncard .src{font-size:10.5px;color:var(--muted)}
  .ncard .go{margin-left:auto;font-size:11.5px;color:var(--accent)}
  .load{padding:40px 0;text-align:center;color:var(--muted);font-size:13px}
  .err{padding:24px;text-align:center;color:#f0b429;font-size:13px;line-height:1.8}
  .err a{display:inline-block;margin-top:10px}
  .nosrc{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px;color:var(--muted);font-size:12.5px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <div class="hdr-top">
      <div class="brand">
        <img class="lg" src="images/logo.jpg" alt="MHO">
        <h1>魔物獵人 旅人助手</h1>
        <span class="badge">J17</span>
      </div>
      <div class="srcbox">
        <div><span id="genAt">更新 –</span>｜<span class="ver" id="verTxt"></span></div>
      </div>
    </div>
  </header>

  <!-- TAB 1 -->
  <section id="v-adv">
    <div class="qbar"><span class="ico">🔍</span><input id="qAdv" type="search" placeholder="搜尋冒險者、定位、屬性"></div>
    <div class="frow" id="fAdvRole"><span class="lbl">定位</span></div>
    <div class="frow" id="fAdvEl"><span class="lbl">屬性</span></div>
    <div class="count" id="cAdvList"></div>
    <div class="grid" id="gAdv"></div>
  </section>

  <!-- TAB 2 -->
  <section id="v-gear" style="display:none">
    <div class="qbar"><span class="ico">🔍</span><input id="qGear" type="search" placeholder="搜尋裝備、套裝、技能"></div>
    <div class="frow" id="fGearKind"><span class="lbl">類別</span></div>
    <div class="frow" id="fGearExtra"></div>
    <div class="frow" id="fGearEl"><span class="lbl">屬性</span></div>
    <div class="count" id="cGearList"></div>
    <div class="grid" id="gGear"></div>
  </section>

  <!-- TAB 3 -->
  <section id="v-mon" style="display:none">
    <div class="qbar"><span class="ico">🔍</span><input id="qMon" type="search" placeholder="搜尋魔物、種類、棲息地"></div>
    <div class="frow" id="fMonSize"><span class="lbl">尺寸</span></div>
    <div class="frow" id="fMonKind"><span class="lbl">種類</span></div>
    <div class="count" id="cMonList"></div>
    <div class="grid" id="gMon"></div>
  </section>

  <!-- TAB 4 -->
  <section id="v-news" style="display:none">
    <div class="count" id="cNews"></div>
    <div id="gNews"></div>
    <div class="nosrc" id="newsSrc"></div>
  </section>
</div>

<nav class="tabs">
  <div class="in">
    <button class="tab on" data-v="adv"><span class="ti"><img src="images/reczz28W1fqrmNCp.webp" alt=""></span>冒險者</button>
    <button class="tab" data-v="gear"><span class="ti">⚔️</span>武器防具</button>
    <button class="tab" data-v="mon"><span class="ti"><img src="images/reczz28WqB6QiE7m_pict.png" alt=""></span>魔物</button>
    <button class="tab" data-v="news"><span class="ti">📰</span>新聞</button>
  </div>
</nav>

<div class="ov" id="ov">
  <div class="bar"><button id="ovBack">← 返回</button><div class="ttl" id="ovTtl"></div></div>
  <div class="body" id="ovBody"></div>
</div>

<script>
(function(){
  var DATA = null, NEWS = null;
  var elMap = {'火':'el-fire','水':'el-water','雷':'el-thunder','冰':'el-ice','龍':'el-dragon','龙':'el-dragon'};
  var ELCOLOR = {'火':'#ff7a45','水':'#4aa8ff','雷':'#f5d76e','冰':'#7fe0ff','龍':'#b58cff'};
  var KIND_ICON = {weapon:'⚔️', armor:'🛡️'};
  var WTYPE_ICON = {'大劍':'🗡️','太刀':'🗡️','雙劍':'⚔️','長槍':'🔱','大錘':'🔨','充能斧':'🪓','重弩槍':'🏹','弓':'🎯'};
  var SLOT_ICON = {'頭部':'🪖','胸部':'🥋','腕部':'🧤','腰部':'🎽','腿部':'🥾'};

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function elTag(e){ if(!e) return ''; return '<span class="tg '+(elMap[e]||'')+'">'+esc(e)+'</span>'; }
  function roleTag(r){ return r ? '<span class="tg role">'+esc(r)+'</span>' : ''; }
  function thumb(img, ph, cls){
    return '<div class="'+(cls||'thumb')+'">'+(img ? '<img loading="lazy" src="'+esc(img)+'" alt="">' : '<span class="ph">'+ph+'</span>')+'</div>';
  }
  function effChip(v){
    var cls = v==='有效' ? 'good' : (v==='無效' ? 'bad' : 'mid');
    return '<span class="effc '+cls+'">'+esc(v)+'</span>';
  }
  function traitChip(v){
    var cls = {'大':'bad','中':'mid','小':'good','無':'gray'}[v] || 'mid';
    return '<span class="effc '+cls+'">'+esc(v)+'</span>';
  }
  function weakDots(w){    var out='';
    ['火','水','雷','冰','龍'].forEach(function(k){
      var v = w ? (w[k]||0) : 0;
      if(!v) return;
      out += '<i class="w'+v+'"></i>';
    });
    return out ? '<div class="mon-weak">'+out+'</div>' : '';
  }
  function stars(v){
    var n = typeof v === 'number' ? v : 0;
    var cls = n>=3 ? 'on3' : (n===2 ? 'on2' : (n===1 ? 'on1' : ''));
    var d='';
    for(var i=0;i<3;i++) d += '<i class="'+(i<n?cls:'')+'"></i>';
    return d;
  }

  /* matrix 表：同一形式的「3 格方塊 + 星數」 */
  function mxRow(lb, color, n, right){
    return '<div class="mr"><span class="mlb"'+(color?' style="color:'+color+'"':'')+'>'+esc(lb)+'</span>'+
      '<span class="dots">'+stars(n)+'</span>'+
      (right?'<span class="mrt">'+esc(right)+'</span>':'')+'</div>';
  }
  function mxGroup(t){
    return '<div class="mgh">'+esc(t)+'</div>';
  }
  function mxMatrix(m){
    var h = '<div class="mx">';
    h += mxGroup('屬性弱點');
    ['火','水','雷','冰','龍'].forEach(function(k){
      var v = m.weak ? (m.weak[k]||0) : 0;
      h += mxRow(k, ELCOLOR[k]||'#c9d1d9', v, v? v+' 星' : '無');
    });

    if(m.ailment){
      h += mxGroup('異常弱點');
      m.ailment.split('、').forEach(function(s){
        var t = s.trim();
        var mm = t.match(/([^ ]+)\s*(\d)星/);
        if(mm) h += mxRow(mm[1], '', parseInt(mm[2],10), mm[2]+' 星');
        else if(t) h += mxRow(t, '', 0, '');
      });
    }

    ovStack = [];
    ov.classList.remove('show');
    document.body.style.overflow = '';
  }
  document.getElementById('ovBack').addEventListener('click', hideOverlay);

  /* ---------- tabs ---------- */
  var views = {adv:'v-adv', gear:'v-gear', mon:'v-mon', news:'v-news'};
  document.querySelectorAll('.tab').forEach(function(b){
    b.addEventListener('click', function(){
      var v = b.getAttribute('data-v');
      document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('on', x===b) });
      Object.keys(views).forEach(function(k){ document.getElementById(views[k]).style.display = (k===v?'':'none') });
      window.scrollTo(0,0);
    });
  });

  /* ---------- events ---------- */
  function bindSearch(inputId, state, key, render){
    var t = null;
    document.getElementById(inputId).addEventListener('input', function(e){
      clearTimeout(t);
      var v = e.target.value;
      t = setTimeout(function(){ state[key] = v.trim(); render(); }, 180);
    });
  }
  function bindChips(containerId, attr, state, key, render, rebuild){
    var box = document.getElementById(containerId);
    box.addEventListener('click', function(e){
      var c = e.target.closest('.chip');
      if(!c || !box.contains(c)) return;
      var v = c.getAttribute('data-'+attr) || '';
      state[key] = v;
      if(rebuild) rebuild();
      render();
    });
  }

  function linkOf(md){
    var m = /\((https?:\/\/[^)]+)\)/.exec(md || '');
    return m ? m[1] : (md || '');
  }

  function bind() {
    bindSearch('qAdv', advState, 'q', renderAdv);
    bindChips('fAdvRole', 'role', advState, 'role', renderAdv, buildAdvFilters);
    bindChips('fAdvEl', 'el', advState, 'el', renderAdv, buildAdvFilters);

    bindSearch('qGear', gearState, 'q', renderGear);
    bindChips('fGearKind', 'kind', gearState, 'kind', function(){ gearState.wtype=''; gearState.slot=''; buildGearFilters(); renderGear(); }, buildGearFilters);
    bindChips('fGearExtra', 'wt', gearState, 'wtype', renderGear, buildGearFilters);
    bindChips('fGearExtra', 'slot', gearState, 'slot', renderGear, buildGearFilters);
    bindChips('fGearEl', 'gel', gearState, 'el', renderGear, buildGearFilters);

    bindSearch('qMon', monState, 'q', renderMon);
    bindChips('fMonSize', 'size', monState, 'size', renderMon, null);
    bindChips('fMonKind', 'mkind', monState, 'kind', renderMon, null);

    document.addEventListener('click', function(e){
      var rs = e.target.closest('[data-reset]');
      if(rs){
        var which = rs.getAttribute('data-reset');
        if(which==='gear'){
          gearState = {q:'', kind:'all', wtype:'', slot:'', el:''};
          document.getElementById('qGear').value='';
          buildGearFilters(); renderGear();
        } else if(which==='adv'){
          advState = {q:'', role:'', el:''};
          document.getElementById('qAdv').value='';
          buildAdvFilters(); renderAdv();
        } else if(which==='mon'){
          monState = {q:'', size:'', kind:''};
          document.getElementById('qMon').value='';
          buildMonFilters(); renderMon();
        }
        return;
      }
      var c = e.target.closest('[data-adv],[data-gear],[data-mon]');
      if(!c) return;
      if(e.target.closest('a')) return;
      if(c.getAttribute('data-adv')) openAdv(c.getAttribute('data-adv'));
      else if(c.getAttribute('data-gear')) openGear(c.getAttribute('data-gear'));
      else if(c.getAttribute('data-mon')) openMon(c.getAttribute('data-mon'));
    });
  }

  /* ---------- boot ---------- */
  function fail(msg){
    document.getElementById('gAdv').innerHTML = '';
    document.querySelector('.wrap').insertAdjacentHTML('afterbegin',
      '<div class="err">載入資料失敗：'+esc(msg)+'<br>請用 localhost（例如 <b>python -m http.server 8792</b>）開啟，或先執行 build_data.py／build_news.py。<br><a href="./data.json">data.json</a></div>');
  }
  function boot(){
    var ts = '?t=' + Date.now();
    Promise.all([
      fetch('data.json' + ts).then(function(r){ if(!r.ok) throw new Error('data.json HTTP '+r.status); return r.json() }),
      fetch('news-cache.json' + ts).then(function(r){ return r.ok ? r.json() : null }).catch(function(){ return null })
    ]).then(function(res){
      DATA = res[0]; NEWS = res[1];
      document.getElementById('genAt').textContent = '更新 ' + DATA.generated;
      document.getElementById('verTxt').textContent = 'v' + (DATA.version || '2026.1.07');
      buildAdvFilters(); buildGearFilters(); buildMonFilters();
      renderAdv(); renderGear(); renderMon(); renderNews();
      bind();
    }).catch(function(err){ fail(err.message || String(err)); });
  }
  boot();
})();
</script>
</body>
</html>
